[package]
name = "rustpython-codegen"
description = "Compiler for python code into bytecode for the rustpython VM."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["thiserror/std", "itertools/use_std"]

[dependencies]
rustpython-compiler-core = { workspace = true }
rustpython-literal = {workspace = true }
rustpython-unicode = { workspace = true }
rustpython-wtf8 = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_text_size = { workspace = true }

bitflags = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }
malachite-bigint = { workspace = true }
memchr = { workspace = true }
rapidhash = { workspace = true }

[target.'cfg(not(target_abi = "polyasm"))'.dependencies]
num-complex = { workspace = true, features = ["std"] }
num-traits = { workspace = true, features = ["std"] }
ruff_python_ast = { workspace = true, features = ["std"] }
ruff_text_size = { workspace = true, features = ["std"] }

[target.'cfg(target_abi = "polyasm")'.dependencies]
num-complex = { workspace = true, features = ["libm"] }
num-traits = { workspace = true, features = ["libm"] }
rustpython-std = { workspace = true }

[dev-dependencies]
ruff_python_parser = { workspace = true }

[lints]
workspace = true
